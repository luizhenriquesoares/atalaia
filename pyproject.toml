[project]
name = "atalaia"
version = "1.5.1"
description = "Plataforma de varredura de vulnerabilidades web (DAST) para alvos autorizados"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "jinja2>=3.1",
  "dnspython>=2.4",
  "cryptography>=42",
  "pydantic>=2.5",
  "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-multipart>=0.0.9", "mcp>=1.10"]
demo = ["python-multipart>=0.0.9"]
# Headless Chromium: after installing, run "python -m playwright install chromium".
browser = ["playwright>=1.45"]
postgres = ["psycopg[binary]>=3.1"]
# Servidor MCP para assistentes de IA (atalaia-mcp). Funciona com o SDK 1.x (>=1.10) e 2.x.
mcp = ["mcp>=1.10"]

[project.scripts]
atalaia-mcp = "atalaia.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atalaia*"]

[tool.setuptools.package-data]
atalaia = ["web/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:asyncio"
