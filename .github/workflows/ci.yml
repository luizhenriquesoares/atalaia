name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atalaia
          POSTGRES_PASSWORD: atalaia-ci
          POSTGRES_DB: atalaia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atalaia" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,browser,postgres]"
      - run: python -m playwright install --with-deps chromium
      - name: Testes (SQLite)
        if: matrix.database == 'sqlite'
        run: pytest
      - name: Testes (PostgreSQL)
        if: matrix.database == 'postgres'
        env:
          ATALAIA_TEST_DATABASE_URL: postgresql+psycopg://atalaia:atalaia-ci@127.0.0.1:5432/atalaia_test
        run: pytest
